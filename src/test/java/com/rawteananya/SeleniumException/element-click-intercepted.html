<!DOCTYPE html>
<html>
<head>
    <title>Click Intercepted Demo</title>

    <style>
        body {
            font-family: Arial;
            padding: 50px;
        }

        #container {
            position: relative;
            width: 300px;
            height: 150px;
        }

        #submit {
            position: absolute;
            top: 50px;
            left: 100px;
            padding: 15px 30px;
        }

        #overlay {
            position: absolute;
            top: 35px;
            left: 80px;
            width: 160px;
            height: 60px;
            background: rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        #removeOverlay {
            margin-top: 30px;
        }
    </style>
</head>

<body>

<h2>Element Click Intercepted Demo</h2>

<div id="container">

    <button id="submit" onclick="submitClicked()">
        Submit
    </button>

    <!-- This element blocks the Submit button -->
    <div id="overlay"></div>

</div>

<button id="removeOverlay" onclick="removeOverlay()">
    Remove Overlay
</button>

<p id="result"></p>

<script>

    function submitClicked() {
        document.getElementById("result").innerText =
            "Submit clicked successfully";
    }

    function removeOverlay() {
        document.getElementById("overlay").remove();
    }

</script>

</body>
</html>
